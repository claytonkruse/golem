# Public settings for Golem. Everything in this file is safe to commit.
# The bot token is a secret and belongs in .env, never here.

# Developer portal → General Information → Application ID. It is also the bot's
# user ID and appears in every invite link. Quote it: YAML reads a bare number
# as a float and loses the last digits.
#
# Set DISCORD_CLIENT_ID in .env to point a local run at a separate development
# application instead of this one.
applicationId: '1566287244707496026'

# Developer portal → General Information → Public Key. Discord signs HTTP
# interactions with the matching private key. Golem receives interactions over
# the gateway, so nothing reads this yet; it is here for an Interactions
# Endpoint URL or a serverless handler later.
publicKey: ef6560540a4000a706b5d15ed0e4229afe76af14a6d423c0edef7830b396708f

# Permission bit field requested by the invite link. Quote it for the same reason
# as applicationId. Currently View Channel (1024) + Send Messages (2048) + Embed
# Links (16384), which event logs need to post. Slash commands need nothing.
# Servers that added Golem earlier keep the permissions they granted then.
invitePermissions: '19456'
